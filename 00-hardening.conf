# =============================================================================
# Globale Härtung (http-Kontext) + Catch-All-Server
#
# Wird als ERSTE Datei aus conf.d geladen ("00-" Präfix).
# =============================================================================

# Keine nginx-Version in Headern / Fehlerseiten (gilt für ALLE Server,
# auch für die Catch-All-Blöcke unten)
server_tokens off;

# Slowloris / langsame Clients: knappe Timeouts, hängende Verbindungen
# sofort per RST freigeben
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;

# Verbindungs-Limit pro Client-IP (Nutzung in den Server-Blöcken)
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_status 429;

# -----------------------------------------------------------------------------
# Catch-All Port 80: alles, was NICHT garden.dedyn.io ist (IP-Scans,
# fremde/gefälschte Host-Header), wird ohne Antwort geschlossen.
# -----------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# -----------------------------------------------------------------------------
# Catch-All Port 443: TLS-Handshake für unbekannte/fehlende SNI ablehnen
# (kein Zertifikat wird ausgeliefert). Kommt ein Request mit gültiger SNI,
# aber fremdem Host-Header hier an, wird er ebenfalls verworfen.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
