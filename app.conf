# =============================================================================
# GEGENWÄRTIG DEAKTIVIERT: Gewächshaus-Steuerung
#
# Die Rate-Limiting-Zonen (api, ws) unten und der 443-Server-Block am
# Dateiende gehören zur Gewächshaus-Steuerung (Proxy nach
# 192.168.178.162:5500). Port 443 belegt inzwischen die Bewerbungs-App
# (siehe bewerbung.conf) — beide Apps können nicht gleichzeitig auf
# 443 laufen.
#
# Zum Reaktivieren: '#' am Zeilenanfang der auskommentierten Zeilen
# entfernen (Zonen + 443-Block) und die Bewerbung wieder auf einen
# separaten Port verlegen.
# =============================================================================
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=ws:10m rate=10r/s;

server {
    listen 80;
    server_name garden.dedyn.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


