# =============================================================================
#
# Bewerbungs-App – Haupt-Reverse-Proxy (Port 80/443)
#
# Öffentliche URL:  https://garden.dedyn.io  (auch ohne "/" im Pfad)
#
# - Port 80 (in app.conf): ACME-Challenge + 301-Redirect auf https://
#   (analog der früheren Gewächshaus-Konfiguration).
# - Port 443: dieser Server-Block. Die Gewächshaus-Steuerung ist
#   momentan in app.conf auskommentiert, da beide Apps nicht
#   gleichzeitig auf 443 laufen können.
# - Nutzt das BESTEHENDE Let's-Encrypt-Zertifikat von garden.dedyn.io.
#   Die Erneuerung läuft wie bisher über den Webroot auf Port 80
#   (Zertifikat ist pro Domain, nicht pro Port) – entrypoint.sh bleibt
#   unverändert.
# - Die App lauscht auf Host-Port 3000 (docker-compose der Bewerbung:
#   "3000:3000"). Port 3000 ist NICHT öffentlich geroutet – er dient
#   nur dem internen Proxy-Zugriff (und dem LAN-Zugriff zum Verwalten).
# - Security-Header (CSP, HSTS, X-Frame-Options, Referrer-Policy, ...)
#   setzt die App selbst – pro Seite unterschiedlich (strikte CSP für
#   die Landingpage, lockere für die SPA). nginx fügt hier deshalb
#   bewusst KEINE add_header-Header hinzu, um doppelte CSP-Header zu
#   vermeiden.
# =============================================================================

# Rate-Limiting-Zone (muss im http-Kontext stehen — limit_req_zone ist
# in server{} nicht erlaubt; conf.d-Dateien liegen bereits in http{})
limit_req_zone $binary_remote_addr zone=bewerbung:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name garden.dedyn.io;
    server_tokens off;

    # SSL Configuration (bestehendes Let's-Encrypt-Zertifikat)
    ssl_certificate /etc/letsencrypt/live/garden.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garden.dedyn.io/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/garden.dedyn.io/chain.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Rate Limiting (Fangnetz gegen Request-Floods; die App limitiert
    # /verify zusätzlich selbst feingranular pro IP + global)
    limit_req_status 429;

    # Logging (isoliert vom Gewächshaus)
    access_log /var/log/nginx/bewerbung.access.log;
    error_log /var/log/nginx/bewerbung.error.log;

    # Security Settings
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Proxy Settings (keine WebSockets in der Bewerbungs-App)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location / {
        limit_req zone=bewerbung burst=60 nodelay;

        proxy_pass http://192.168.178.162:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
